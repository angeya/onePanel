<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化 & 压缩工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 12px 14px;
            display: flex;
            overflow: hidden;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        /* 中间按钮组 */
        .action-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .panel-options {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 1px;
            white-space: nowrap;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn.encode {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
        }

        .btn.encode:hover {
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }

        .btn.decode {
            background: linear-gradient(135deg, #059669, #34d399);
            color: #fff;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.35);
        }

        .btn.decode:hover {
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.5);
        }

        .btn.copy {
            background: rgba(255, 255, 255, 0.08);
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 20px;
            font-size: 0.78rem;
        }

        .btn.copy:hover {
            color: #e5e7eb;
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* 选项 */
        .option-label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            font-size: 0.78rem;
            color: #9ca3af;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            user-select: none;
        }

        .option-label:hover {
            color: #e5e7eb;
        }

        .option-label input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #a78bfa;
            cursor: pointer;
        }

        /* 编辑器区域 */
        .editor-container {
            display: flex;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: box-shadow 0.3s;
            min-height: 0;
        }

        .editor-panel:hover {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.12);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .panel-title-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .panel-title-icon.input {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
        }

        .panel-title-icon.output {
            background: linear-gradient(135deg, #34d399, #059669);
        }

        .panel-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .code-editor {
            width: 100%;
            height: 100%;
            padding: 12px 14px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #e5e7eb;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            resize: none;
            outline: none;
            tab-size: 2;
            transition: box-shadow 0.25s;
        }

        .code-editor:focus {
            box-shadow: inset 0 0 0 2px rgba(139, 92, 246, 0.5);
        }

        .code-editor::placeholder {
            color: #4b5563;
        }

        /* 行号 */
        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            width: 46px;
            height: 100%;
            padding: 12px 8px;
            background: rgba(0, 0, 0, 0.35);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #4b5563;
            text-align: right;
            overflow: hidden;
            user-select: none;
            z-index: 1;
        }

        .code-editor.with-line-numbers {
            padding-left: 60px;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            color: #6b7280;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-success { color: #34d399; }
        .status-error { color: #f87171; }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            min-width: 180px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .toast-success {
            background: linear-gradient(135deg, #059669, #34d399);
        }

        .toast-error {
            background: linear-gradient(135deg, #dc2626, #f87171);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(10px);
            }
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .editor-container {
                flex-direction: column;
            }

            .action-group {
                flex-direction: row;
                justify-content: center;
                padding: 4px 0;
            }
        }

        @media (max-width: 640px) {
            body {
                display: block;
                overflow: auto;
                padding: 10px;
            }

            .container {
                height: auto;
            }

            .editor-container {
                min-height: 600px;
            }

            .action-group {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-container">
            <!-- 输入面板 -->
            <div class="editor-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-title-icon input">I</span>
                        <span>输入 JSON</span>
                    </div>
                    <div class="panel-options">
                        <label class="option-label">
                            <input type="checkbox" id="unescapeCheck" checked>
                            <span>去转义</span>
                        </label>
                        <label class="option-label">
                            <input type="checkbox" id="sortKeysCheck">
                            <span>排序</span>
                        </label>
                    </div>
                </div>
                <div class="panel-content">
                    <div class="line-numbers" id="inputLineNumbers">1</div>
                    <textarea
                        class="code-editor with-line-numbers"
                        id="inputEditor"
                        placeholder="在此粘贴 JSON 数据..."
                        oninput="updateLineNumbers('input')"
                        onscroll="syncScroll('input')"
                    ></textarea>
                </div>
                <div class="status-bar">
                    <div class="status-item">
                        <span>字符:</span>
                        <span id="inputCharCount">0</span>
                    </div>
                    <div class="status-item">
                        <span>行:</span>
                        <span id="inputLineCount">1</span>
                    </div>
                </div>
            </div>

            <!-- 中间操作按钮 -->
            <div class="action-group">
                <button class="btn encode" onclick="formatJSON()">格式化</button>
                <button class="btn decode" onclick="compressJSON()">压缩</button>
                <button class="btn copy" onclick="pasteInput()">粘贴</button>
                <button class="btn copy" onclick="copyOutput()">复制</button>
                <button class="btn copy" onclick="downloadJSON()">下载</button>
                <button class="btn copy" onclick="clearAll()">清空</button>
            </div>

            <!-- 输出面板 -->
            <div class="editor-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-title-icon output">O</span>
                        <span>输出结果</span>
                    </div>
                </div>
                <div class="panel-content">
                    <div class="line-numbers" id="outputLineNumbers">1</div>
                    <textarea
                        class="code-editor with-line-numbers"
                        id="outputEditor"
                        placeholder="处理后的 JSON 将显示在这里..."
                        readonly
                        onscroll="syncScroll('output')"
                    ></textarea>
                </div>
                <div class="status-bar">
                    <div class="status-item" id="statusText">
                        <span>等待处理...</span>
                    </div>
                    <div class="status-item">
                        <span>字符:</span>
                        <span id="outputCharCount">0</span>
                    </div>
                    <div class="status-item">
                        <span>行:</span>
                        <span id="outputLineCount">1</span>
                    </div>
                    <div class="status-item">
                        <span>压缩率:</span>
                        <span id="compressionRatio">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // 更新行号
        function updateLineNumbers(type) {
            const editor = document.getElementById(type + 'Editor');
            const lineNumbers = document.getElementById(type + 'LineNumbers');
            const lines = editor.value.split('\n').length;
            lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');

            // 更新统计
            document.getElementById(type + 'CharCount').textContent = editor.value.length;
            document.getElementById(type + 'LineCount').textContent = lines;
        }

        // 同步滚动
        function syncScroll(type) {
            const editor = document.getElementById(type + 'Editor');
            const lineNumbers = document.getElementById(type + 'LineNumbers');
            lineNumbers.scrollTop = editor.scrollTop;
        }

        // 去除 Java 字符串转义
        function unescapeJavaString(str) {
            if (!document.getElementById('unescapeCheck').checked) {
                return str;
            }

            // 处理常见的 Java 字符串转义
            return str
                .replace(/^"/, '')  // 去除开头的引号
                .replace(/"$/, '')  // 去除结尾的引号
                .replace(/\\"/g, '"')  // \" -> "
                .replace(/\\\\/g, '\\')  // \\ -> \
                .replace(/\\n/g, '\n')   // \n -> 换行
                .replace(/\\r/g, '\r')   // \r -> 回车
                .replace(/\\t/g, '\t')   // \t -> 制表符
                .replace(/\\b/g, '\b')   // \b -> 退格
                .replace(/\\f/g, '\f')   // \f -> 换页
                .replace(/\\\//g, '/');  // \/ -> /
        }

        // 解析 JSON
        function parseJSON(str) {
            try {
                // 首先尝试直接解析
                return JSON.parse(str);
            } catch (e) {
                // 如果失败，尝试去除 Java 转义后再解析
                const unescaped = unescapeJavaString(str);
                return JSON.parse(unescaped);
            }
        }

        // 格式化 JSON
        function formatJSON() {
            const input = document.getElementById('inputEditor').value.trim();
            if (!input) {
                showToast('请输入 JSON 数据', 'error');
                return;
            }

            try {
                const data = parseJSON(input);
                const shouldSort = document.getElementById('sortKeysCheck').checked;

                let formatted;
                if (shouldSort) {
                    formatted = JSON.stringify(sortObjectKeys(data), null, 2);
                } else {
                    formatted = JSON.stringify(data, null, 2);
                }

                document.getElementById('outputEditor').value = formatted;
                updateLineNumbers('output');
                updateStatus('格式化成功', 'success');
                updateCompressionRatio(input.length, formatted.length);
            } catch (e) {
                showToast('JSON 格式错误: ' + e.message, 'error');
                updateStatus('格式化失败', 'error');
            }
        }

        // 压缩 JSON
        function compressJSON() {
            const input = document.getElementById('inputEditor').value.trim();
            if (!input) {
                showToast('请输入 JSON 数据', 'error');
                return;
            }

            try {
                const data = parseJSON(input);
                const shouldSort = document.getElementById('sortKeysCheck').checked;

                let compressed;
                if (shouldSort) {
                    compressed = JSON.stringify(sortObjectKeys(data));
                } else {
                    compressed = JSON.stringify(data);
                }

                document.getElementById('outputEditor').value = compressed;
                updateLineNumbers('output');
                updateStatus('压缩成功', 'success');
                updateCompressionRatio(input.length, compressed.length);
            } catch (e) {
                showToast('JSON 格式错误: ' + e.message, 'error');
                updateStatus('压缩失败', 'error');
            }
        }

        // 排序对象键名
        function sortObjectKeys(obj) {
            if (Array.isArray(obj)) {
                return obj.map(sortObjectKeys);
            } else if (obj !== null && typeof obj === 'object') {
                const sorted = {};
                Object.keys(obj).sort().forEach(key => {
                    sorted[key] = sortObjectKeys(obj[key]);
                });
                return sorted;
            }
            return obj;
        }

        // 更新状态
        function updateStatus(message, type) {
            const statusText = document.getElementById('statusText');
            statusText.innerHTML = `<span class="status-${type}">${message}</span>`;
        }

        // 更新压缩率
        function updateCompressionRatio(original, compressed) {
            const ratio = ((1 - compressed / original) * 100).toFixed(1);
            const ratioText = ratio > 0 ? `-${ratio}%` : `+${Math.abs(ratio)}%`;
            document.getElementById('compressionRatio').textContent = ratioText;
            document.getElementById('outputCharCount').textContent = compressed;
        }

        // 复制输出
        async function copyOutput() {
            const output = document.getElementById('outputEditor').value;
            if (!output) {
                showToast('没有可复制的内容', 'error');
                return;
            }

            try {
                await navigator.clipboard.writeText(output);
                showToast('已复制到剪贴板', 'success');
            } catch (e) {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = output;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('已复制到剪贴板', 'success');
            }
        }

        // 粘贴输入
        async function pasteInput() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputEditor').value = text;
                updateLineNumbers('input');
                showToast('已粘贴', 'success');
            } catch (e) {
                showToast('无法访问剪贴板', 'error');
            }
        }

        // 清空
        function clearAll() {
            document.getElementById('inputEditor').value = '';
            document.getElementById('outputEditor').value = '';
            updateLineNumbers('input');
            updateLineNumbers('output');
            document.getElementById('compressionRatio').textContent = '-';
            updateStatus('等待处理...', 'normal');
            showToast('已清空', 'success');
        }

        // 下载 JSON
        function downloadJSON() {
            const output = document.getElementById('outputEditor').value;
            if (!output) {
                showToast('没有可下载的内容', 'error');
                return;
            }

            const blob = new Blob([output], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'output.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已下载', 'success');
        }

        // 显示 Toast
        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            const icon = type === 'success' ? '✓' : '✗';
            toast.innerHTML = `
                <span style="font-weight: 700;">${icon}</span>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // 监听输入变化
        document.getElementById('inputEditor').addEventListener('input', function() {
            updateLineNumbers('input');
        });

        // 初始化
        updateLineNumbers('input');
        updateLineNumbers('output');
    </script>
</body>
</html>
